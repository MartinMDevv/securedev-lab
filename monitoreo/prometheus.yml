# Prometheus raspa /metrics de «producción» por la red Docker interna «securedev».
# El puerto 8000 no está publicado al host: /metrics (sin autenticación) solo se ve desde esa red.
global:
  scrape_interval: 5s       # corto a propósito: en el lab los incidentes duran segundos
  evaluation_interval: 5s

scrape_configs:
  - job_name: securedev
    metrics_path: /metrics
    static_configs:
      - targets: ["jenkins-p3:8000"]
        labels:
          entorno: produccion
