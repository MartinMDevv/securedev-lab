name: securedev-estudiante

services:
  app:
    build: .
    environment:
      DATABASE_PATH: /data/securedev.db
      # Se lee del archivo .env (fuera de git). Si falta, compose no arranca.
      SECRET_KEY: ${SECRET_KEY:?Falta SECRET_KEY en .env (ver .env.example)}
    volumes:
      - app_data:/data
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  app_data:
